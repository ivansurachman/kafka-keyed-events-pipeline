# 3 broker KRaft (tanpa Zookeeper) + Kafka UI. 3 broker = replication factor 3 bisa didemokan.
x-kafka-env: &kafka-env
  CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 2

services:
  kafka-1:
    image: apache/kafka:3.8.0
    container_name: kafka-1
    ports: ["29092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://localhost:29092

  kafka-2:
    image: apache/kafka:3.8.0
    container_name: kafka-2
    ports: ["29093:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:29093

  kafka-3:
    image: apache/kafka:3.8.0
    container_name: kafka-3
    ports: ["29094:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://localhost:29094

  # Buat topic: 3 partition, replication factor 3. Retry sampai cluster siap.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on: [kafka-1, kafka-2, kafka-3]
    restart: "no"
    command:
      - /bin/bash
      - -c
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092 \
          --create --if-not-exists --topic ${KAFKA_TOPIC:-events_topic} --partitions ${TOPIC_PARTITIONS:-3} --replication-factor ${TOPIC_REPLICATION_FACTOR:-3}; do
          echo "cluster belum siap, retry..."; sleep 3
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092 --describe --topic ${KAFKA_TOPIC:-events_topic}

  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafbat-ui
    depends_on: [kafka-1, kafka-2, kafka-3]
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
